name: Renovate
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: true
      debug:
        description: 'Debug'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * *'

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: renovatebot/github-action@v46.3.7
        with:
          # Global (self-hosted) config: which repos, how tools are installed.
          # The rules every repo shares live in default.json and are pulled
          # in per repo with "extends": ["local>stack4ops/renovate"].
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'full' || '' }}
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'debug' || 'info' }}
